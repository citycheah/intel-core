[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intel-core"
version = "0.1.0"
description = "Shared data contracts, DuckDB/Parquet storage + HITL overrides, Gemini Vision FinOps wrapper, media staging, pure-Python MMM simulation, and Golden Vision evals for the Creative Intelligence Suite."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "Cheah Chuen Thong"},
]
keywords = ["advertising", "gemini", "multimodal", "finops", "duckdb", "parquet", "pydantic", "evals"]
dependencies = [
    "duckdb>=1.0.0",
    "google-genai>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "Pillow>=10.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["intel_core"]

[tool.hatch.build.targets.wheel.force-include]
"evals/golden_vision_set" = "intel_core/evals_data/golden_vision_set"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
